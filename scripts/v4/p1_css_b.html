<style>
/* =================== MAIN CHAT =================== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;z-index:10}

.hdr{display:flex;align-items:center;gap:12px;padding:13px 22px;position:relative;z-index:5;
  background:linear-gradient(180deg,rgba(255,252,248,.9),rgba(255,252,248,.55) 70%,transparent);
  -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px)}
.hdr::after{content:"";position:absolute;left:22px;right:22px;bottom:0;height:1px;
  background:linear-gradient(90deg,rgba(244,205,184,.55),rgba(169,206,232,.4) 45%,transparent)}
.hdr-ava{width:46px;height:46px;border-radius:50%;object-fit:contain;padding:5px;flex:0 0 auto;
  background:radial-gradient(120% 120% at 28% 22%,var(--peach-2),var(--powder));
  box-shadow:0 2px 10px rgba(27,42,61,.08),inset 0 0 0 1px rgba(255,255,255,.65);transition:transform .3s var(--tr)}
.hdr-ava.wink{animation:syWink 1s ease}
.hdr-id{min-width:0;line-height:1.25}
.hdr-id b{display:flex;align-items:center;gap:8px;font-size:16.5px;font-weight:800;letter-spacing:.2px}
.hdr-id small{display:block;font-size:12px;font-weight:500;color:var(--ink-2)}
.hdr-id .ai-pill{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ocean);
  background:var(--powder);padding:3px 8px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(169,206,232,.5)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ink);
  background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px var(--line),0 1px 4px rgba(27,42,61,.05);
  padding:7px 13px;border-radius:99px;white-space:nowrap}
.chip svg{width:13.5px;height:13.5px;stroke:var(--ocean);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);
  background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px var(--line);transition:all var(--tt) var(--tr)}
.icon-btn:hover{color:var(--ocean);background:#fff;box-shadow:inset 0 0 0 1px var(--sky),0 4px 10px rgba(27,42,61,.07);transform:translateY(-1px)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.only-m{display:none}

/* ---------- scroller + thread ---------- */
.scroller{flex:1;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;padding:0 0 8px}
.thread{max-width:820px;margin:0 auto;padding:18px 26px 10px;display:flex;flex-direction:column;gap:22px}

/* ---------- welcome ---------- */
.welcome{max-width:660px;margin:0 auto;padding:5vh 26px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:riseIn .5s var(--tr) backwards}
.w-hero{position:relative;width:190px;height:170px;display:grid;place-items:center;margin-bottom:6px}
.w-blob{position:absolute;inset:8px 10px 16px;border-radius:50% 46% 55% 48%/55% 50% 52% 46%;
  background:radial-gradient(90% 90% at 32% 24%,rgba(255,255,255,.95),rgba(249,223,207,.75) 55%,rgba(220,235,246,.55));
  box-shadow:0 18px 44px -14px rgba(222,136,103,.28),inset 0 0 0 1px rgba(255,255,255,.7);filter:blur(.4px)}
.w-mascot{width:150px;position:relative;animation:syFloat 4.6s ease-in-out infinite;filter:drop-shadow(0 14px 18px rgba(20,50,83,.18))}
.w-star{position:absolute;color:var(--gold);animation:syTwinkle 2.6s ease-in-out infinite}
.w-star svg{width:100%;height:100%;fill:currentColor;stroke:none}
.w-star.s1{width:17px;height:17px;top:6px;left:12px}
.w-star.s2{width:11px;height:11px;top:34px;right:8px;animation-delay:.9s}
.w-star.s3{width:13px;height:13px;bottom:26px;left:-2px;animation-delay:1.6s}
.welcome h1{margin:2px 0 10px;font-size:30px;font-weight:800;letter-spacing:-.4px;
  background:linear-gradient(100deg,#16345A,#2A5A8A 55%,#C97B54);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome .w-sub{margin:0 0 8px;font-size:15px;color:var(--ink-2);max-width:480px}
.welcome .w-q{margin:0 0 26px;font-size:16.5px;font-weight:700;color:var(--ink)}
.w-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.w-chip{display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:99px;font-size:13.5px;font-weight:700;color:var(--ink);
  background:rgba(255,255,255,.78);box-shadow:inset 0 0 0 1px var(--line),0 2px 8px rgba(27,42,61,.06);
  transition:all var(--tt) var(--tr)}
.w-chip svg{width:16px;height:16px;stroke:var(--ocean);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:stroke var(--tt)}
.w-chip:hover{transform:translateY(-2.5px);box-shadow:inset 0 0 0 1.5px rgba(169,206,232,.7),0 10px 20px -6px rgba(42,90,138,.25);color:var(--ocean)}
.w-chip.ghost svg{stroke:var(--coral)}
.w-note{margin-top:26px;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}

/* ---------- messages ---------- */
.msg{display:flex;gap:12px;animation:msgIn .38s var(--tr) backwards}
.msg-u{justify-content:flex-end}
.msg-u .bubble{max-width:min(78%,560px);background:linear-gradient(135deg,#2E5F92,#417FBA);color:#F4F9FE;
  padding:12px 16px;border-radius:18px 18px 5px 18px;box-shadow:0 6px 16px -6px rgba(42,90,138,.45);font-size:14.5px;line-height:1.62;
  white-space:pre-wrap;word-break:break-word}
.msg-a .ava{width:40px;height:40px;flex:0 0 auto;border-radius:50%;object-fit:contain;padding:4px;margin-top:2px;
  background:radial-gradient(120% 120% at 30% 22%,var(--peach-2),var(--powder));
  box-shadow:0 2px 8px rgba(27,42,61,.08),inset 0 0 0 1px rgba(255,255,255,.6)}
.msg-body{max-width:min(86%,640px);min-width:0}
.bubble-a{background:var(--card);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border-radius:6px 18px 18px 18px;padding:14px 18px 12px;box-shadow:0 1px 2px rgba(27,42,61,.04),0 6px 20px -8px rgba(27,42,61,.08),inset 0 0 0 1px rgba(237,223,211,.7)}
.msg-meta{display:flex;align-items:center;gap:8px;margin-top:7px;padding-left:6px;font-size:10.5px;color:var(--ink-3);opacity:.9}
.msg-meta .sample-pill{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);
  background:rgba(222,136,103,.12);padding:2px 7px;border-radius:99px}
.msg-meta button{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--ink-3);
  padding:2.5px 7px;border-radius:7px;opacity:0;transition:all .18s var(--tr)}
.msg-meta button:hover{color:var(--ocean);background:rgba(169,206,232,.16)}
.msg:hover .msg-meta button{opacity:1}
.msg-meta button svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* notice / error bubbles */
.bubble-n{background:linear-gradient(135deg,rgba(249,223,207,.85),rgba(220,235,246,.8));border-radius:6px 18px 18px 18px;
  padding:14px 17px;box-shadow:inset 0 0 0 1.2px rgba(244,205,184,.9),0 4px 14px -6px rgba(201,138,61,.25);font-size:13.5px;line-height:1.65;color:#6B4A32}
.bubble-n b{color:#8A5A38}
.bubble-e{background:linear-gradient(135deg,#FBEAE7,#FDF3EF);border-radius:6px 18px 18px 18px;padding:14px 17px;
  box-shadow:inset 0 0 0 1.2px rgba(196,87,78,.28),0 4px 14px -6px rgba(196,87,78,.25);font-size:13.5px;line-height:1.65;color:#7C4038}
.bubble-e .e-title{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--err)}
.bubble-e .e-title svg{width:15px;height:15px;stroke:var(--err);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bubble-e .e-detail{margin-top:4px;font-size:12px;color:#A0655C;word-break:break-word}
.bubble-e .retry{margin-top:10px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#C4574E,#D97B62);padding:8px 14px;border-radius:10px;box-shadow:0 4px 12px -4px rgba(196,87,78,.5);
  transition:all var(--tt) var(--tr)}
.bubble-e .retry:hover{transform:translateY(-1px);filter:brightness(1.05)}
.bubble-e .retry svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* typing indicator */
.typing{display:flex;align-items:center;gap:11px}
.typing .ava{width:40px;height:40px;border-radius:50%;object-fit:contain;padding:4px;
  background:radial-gradient(120% 120% at 30% 22%,var(--peach-2),var(--powder));
  box-shadow:0 2px 8px rgba(27,42,61,.08),inset 0 0 0 1px rgba(255,255,255,.6);animation:syPulse 1.5s ease-in-out infinite}
.typing .t-b{display:flex;align-items:center;gap:5px;background:var(--card);padding:13px 17px;border-radius:6px 18px 18px 18px;
  box-shadow:inset 0 0 0 1px rgba(237,223,211,.7)}
.typing .t-b i{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--ocean),var(--sky));opacity:.4;animation:syBounce 1.2s ease-in-out infinite}
.typing .t-b i:nth-child(2){animation-delay:.15s}
.typing .t-b i:nth-child(3){animation-delay:.3s}
.typing .t-note{font-size:11px;color:var(--ink-3);margin-left:5px;font-weight:600}

/* follow-up chips */
.fups{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-left:6px}
.fup{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ocean);
  background:rgba(255,255,255,.8);padding:8px 13px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(169,206,232,.55);
  transition:all var(--tt) var(--tr)}
.fup svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fup:hover{background:#fff;transform:translateY(-1.5px);box-shadow:inset 0 0 0 1.5px rgba(169,206,232,.8),0 8px 16px -6px rgba(42,90,138,.3)}

/* ---------- markdown ---------- */
.md{font-size:14.5px;line-height:1.7;word-break:break-word}
.md p{margin:.45em 0}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:.2em}
.md h1,.md h2,.md h3,.md h4{margin:1.1em 0 .45em;font-weight:800;line-height:1.35;letter-spacing:-.2px;color:var(--ink)}
.md h1{font-size:1.45em}.md h2{font-size:1.22em}.md h3{font-size:1.08em}.md h4{font-size:1em}
.md h2,.md h3{padding-left:10px;border-left:3px solid var(--peach)}
.md ul,.md ol{margin:.5em 0;padding-left:1.45em}
.md li{margin:.3em 0}
.md li::marker{color:var(--ocean-2)}
.md strong{font-weight:800;color:#143253}
.md em{font-style:italic;color:#3D5E82}
.md a{color:var(--ocean-2);font-weight:600;text-decoration:none;border-bottom:1.5px solid rgba(169,206,232,.7)}
.md a:hover{color:var(--coral);border-color:var(--coral)}
.md code{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;
  background:rgba(169,206,232,.18);padding:.14em .42em;border-radius:6px;color:#1C4066;box-shadow:inset 0 0 0 1px rgba(169,206,232,.3)}
.md pre{background:#0F2A47;color:#DCEBF6;border-radius:14px;padding:14px 16px;overflow-x:auto;margin:.7em 0;box-shadow:var(--shadow-m)}
.md pre code{background:none;color:inherit;padding:0;box-shadow:none;font-size:12.5px;line-height:1.6}
.md blockquote{margin:.7em 0;padding:.5em 1em;border-left:3px solid var(--peach);background:rgba(249,223,207,.4);border-radius:0 12px 12px 0;color:#6B4A32}
.md hr{border:0;height:1px;margin:1.1em 0;background:linear-gradient(90deg,var(--line),rgba(169,206,232,.5),transparent)}
.md table{border-collapse:separate;border-spacing:0;width:100%;margin:.8em 0;font-size:13px;border-radius:12px;overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--line-blue)}
.md th{background:linear-gradient(135deg,#EAF3FA,var(--mist));text-align:left;font-weight:800;color:var(--ink);padding:9px 13px;font-size:12px;letter-spacing:.02em}
.md td{padding:8.5px 13px;border-top:1px solid var(--line-blue);background:rgba(255,255,255,.6);color:#33526F;vertical-align:top}
.md tr:nth-child(even) td{background:rgba(255,251,247,.85)}
.md .tbl-wrap{overflow-x:auto;border-radius:12px}
.md .math{font-family:Georgia,'Times New Roman',serif;font-style:italic;white-space:nowrap;padding:0 .12em;color:#143253}
.md .math b{font-weight:600}
.md .mfrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:-.55em;margin:0 .18em;line-height:1.15;font-size:.92em}
.md .mfrac>i{font-style:normal;display:block;padding:0 .3em}
.md .mfrac>i:first-child{border-bottom:1.4px solid currentColor}
.md .math sup,.md .math sub{font-size:.68em}
.md .math-block{display:block;text-align:center;margin:.8em 0;font-size:1.12em;padding:.7em .9em;background:rgba(220,235,246,.32);
  border-radius:12px;box-shadow:inset 0 0 0 1px rgba(169,206,232,.3);overflow-x:auto}
.md .ok{color:var(--ok);font-weight:700}

/* ---------- composer ---------- */
.comp-wrap{padding:6px 26px calc(14px + env(safe-area-inset-bottom));position:relative;z-index:5}
.comp{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 18px;
  background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-radius:24px;box-shadow:inset 0 0 0 1.4px var(--line),0 10px 30px -12px rgba(27,42,61,.18);
  transition:box-shadow var(--tt) var(--tr),transform var(--tt) var(--tr)}
.comp:focus-within{box-shadow:inset 0 0 0 1.6px rgba(169,206,232,.85),0 0 0 4px rgba(244,205,184,.35),0 14px 34px -12px rgba(27,42,61,.2);transform:translateY(-1px)}
.comp textarea{flex:1;border:0;outline:none;resize:none;background:none;font-size:14.5px;line-height:1.55;color:var(--ink);
  max-height:170px;padding:8px 0}
.comp textarea::placeholder{color:var(--ink-3)}
.comp textarea:disabled{opacity:.55}
.send{width:42px;height:42px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#DE8867,#E9A97F 60%,#F4CDB8);box-shadow:0 6px 16px -5px rgba(222,136,103,.6),inset 0 1px 0 rgba(255,255,255,.35);
  transition:all var(--tt) var(--tr)}
.send svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--tt) var(--tr)}
.send:hover:not(:disabled){transform:translateY(-1.5px) scale(1.04);box-shadow:0 10px 22px -6px rgba(222,136,103,.65)}
.send:hover:not(:disabled) svg{transform:translateX(1.5px) rotate(-8deg)}
.send:active:not(:disabled){transform:scale(.96)}
.send:disabled{background:linear-gradient(135deg,#D5DEE8,#C3D2E0);box-shadow:none;cursor:not-allowed}
.send.busy svg{animation:sySpin 1s linear infinite}
.comp-foot{max-width:820px;margin:8px auto 0;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-3);padding:0 10px}
.comp-foot .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--warn);box-shadow:0 0 0 3px rgba(201,138,61,.18)}
.comp-foot .dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(47,143,98,.16)}
.comp-foot .hint{margin-left:auto;white-space:nowrap}
.comp-foot .hint kbd{font-family:var(--font);font-size:10px;font-weight:700;background:rgba(255,255,255,.8);padding:1.5px 6px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line)}
</style>
