<style>
/* ============================================================
   SAATHY · design system — calm peach × ocean blue
   ============================================================ */
:root{
  --cream:#FFF8F1; --cream-2:#FDF1E7; --ivory:#FFFCF8;
  --ink:#1B3A5C; --ink-2:#5E7A96; --ink-3:#93A9C0;
  --navy-950:#0A1C30; --navy-900:#0E2540; --navy-800:#143253; --navy-700:#1C4066;
  --ocean:#2A5A8A; --ocean-2:#3E7CB8;
  --sky:#A9CEE8; --sky-2:#CBE2F2; --powder:#DCEBF6;
  --peach:#F4CDB8; --peach-2:#F9DFCF; --mist:#FBE9DF; --coral:#DE8867;
  --gold:#E9B85C;
  --card:rgba(255,255,255,.74); --card-solid:#FFFDFB;
  --line:#EDDFD3; --line-blue:#DFE8F1;
  --ok:#2F8F62; --warn:#C98A3D; --err:#C4574E;
  --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:26px;
  --shadow-s:0 1px 2px rgba(27,42,61,.05),0 2px 10px rgba(27,42,61,.05);
  --shadow-m:0 4px 16px rgba(27,42,61,.09),0 1px 3px rgba(27,42,61,.05);
  --shadow-l:0 24px 60px -16px rgba(20,40,64,.28);
  --ring:0 0 0 3.5px rgba(244,205,184,.5);
  --tr:cubic-bezier(.33,1,.36,1); --tt:.28s;
  --sb-w:288px; --sb-rail:82px; --dr-w:420px;
  --font:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;
  background:linear-gradient(160deg,#FFF9F3,#FBEFE6)}
img{max-width:100%}
button{font-family:var(--font);cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:var(--font);color:var(--ink)}
::selection{background:rgba(244,205,184,.65)}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(94,122,150,.28);border-radius:99px;border:2.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(94,122,150,.45);background-clip:content-box;border:2.5px solid transparent}
::-webkit-scrollbar-track{background:transparent}
.sb ::-webkit-scrollbar-thumb{background:rgba(202,222,240,.22);background-clip:content-box;border:2.5px solid transparent}
.hidden{display:none!important}
svg.ic{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* =================== APP SHELL =================== */
.app{display:flex;height:100dvh;overflow:hidden;position:relative;
  background:
    radial-gradient(1100px 720px at 88% -12%, rgba(169,206,232,.42), transparent 62%),
    radial-gradient(1000px 640px at -12% 112%, rgba(244,205,184,.5), transparent 56%),
    radial-gradient(720px 520px at 106% 106%, rgba(249,223,207,.42), transparent 60%),
    linear-gradient(160deg,#FFF9F3 0%,#FDF2E9 52%,#F7EEE7 100%);}
.app::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(500px 300px at 50% 120%, rgba(255,255,255,.5), transparent 70%)}

/* =================== SIDEBAR =================== */
.sb{width:var(--sb-w);flex:0 0 auto;display:flex;flex-direction:column;gap:12px;
  padding:18px 12px 12px;position:relative;z-index:40;color:#E8F1FA;
  background:linear-gradient(196deg,#12304F 0%,#0D2440 50%,#0A1D33 100%);
  box-shadow:1px 0 0 rgba(255,255,255,.05),8px 0 34px -18px rgba(10,28,48,.55);
  transition:width .34s var(--tr),transform .34s var(--tr)}
.sb::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(430px 280px at 18% -6%, rgba(169,206,232,.17), transparent 62%),
             radial-gradient(400px 300px at 96% 108%, rgba(244,205,184,.13), transparent 60%)}
.sb>*{position:relative}
.sb-brand{display:flex;align-items:center;gap:11px;padding:2px 6px 8px;border-bottom:1px solid rgba(202,222,240,.13)}
.sb-ava{width:44px;height:44px;border-radius:14px;object-fit:contain;padding:4px;flex:0 0 auto;
  background:radial-gradient(120% 120% at 30% 20%, rgba(169,206,232,.35), rgba(244,205,184,.28));
  box-shadow:inset 0 0 0 1px rgba(202,222,240,.22);animation:syFloat 5.2s ease-in-out infinite}
.sb-name{line-height:1.2;min-width:0}
.sb-name b{display:block;font-size:17.5px;font-weight:800;letter-spacing:.2px;color:#FFF}
.sb-name span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(203,226,242,.62)}
.sb-coll{margin-left:auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:rgba(203,226,242,.75);transition:all var(--tt) var(--tr)}
.sb-coll:hover{background:rgba(202,222,240,.14);color:#fff}

.newchat{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;font-weight:700;font-size:14px;color:#fff;
  background:linear-gradient(135deg,#2A5A8A,#3E7CB8 70%,#5E97C9);box-shadow:0 6px 16px -6px rgba(62,124,184,.55),inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform var(--tt) var(--tr),box-shadow var(--tt) var(--tr),filter var(--tt)}
.newchat:hover{transform:translateY(-1.5px);box-shadow:0 10px 22px -6px rgba(62,124,184,.6),inset 0 1px 0 rgba(255,255,255,.22);filter:saturate(1.06)}
.newchat:active{transform:translateY(0) scale(.985)}
.newchat svg.ic{width:17px;height:17px;stroke-width:2.2}

.sb-search{display:flex;align-items:center;gap:9px;padding:9.5px 12px;border-radius:12px;
  background:rgba(202,222,240,.09);box-shadow:inset 0 0 0 1px rgba(202,222,240,.14);transition:box-shadow var(--tt)}
.sb-search:focus-within{box-shadow:inset 0 0 0 1.5px rgba(169,206,232,.55)}
.sb-search svg{width:15.5px;height:15.5px;stroke:rgba(203,226,242,.66);fill:none;stroke-width:2;stroke-linecap:round}
.sb-search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:13.5px;color:#EAF2FA}
.sb-search input::placeholder{color:rgba(203,226,242,.45)}

.sb-list{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:3px;padding:4px 2px 8px;margin:0 -2px;scrollbar-gutter:stable}
.sb-cap{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(203,226,242,.42);padding:10px 10px 4px}
.chat-item{display:flex;align-items:center;gap:10px;padding:9.5px 10px;border-radius:12px;cursor:pointer;position:relative;
  transition:background .18s var(--tr),transform .18s var(--tr);animation:riseIn .34s var(--tr) backwards}
.chat-item:hover{background:rgba(202,222,240,.09)}
.chat-item.on{background:linear-gradient(90deg,rgba(169,206,232,.2),rgba(169,206,232,.08));box-shadow:inset 2.5px 0 0 var(--sky)}
.chat-item .ci-ic{width:30px;height:30px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  background:rgba(202,222,240,.1);color:rgba(203,226,242,.85)}
.chat-item.on .ci-ic{background:rgba(169,206,232,.24);color:#DCEBF6}
.chat-item .ci-ic svg{width:15px;height:15px;stroke-width:1.9;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.ci-txt{min-width:0;flex:1;line-height:1.3}
.ci-txt b{display:block;font-size:13.5px;font-weight:600;color:#E5EFF9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-txt span{display:block;font-size:11px;color:rgba(203,226,242,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ci-demo{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#F4CDB8;background:rgba(244,205,184,.13);
  padding:2.5px 6px;border-radius:99px;flex:0 0 auto}
.ci-del{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  color:rgba(203,226,242,.6);opacity:0;transition:all .18s var(--tr);background:rgba(10,29,51,.75)}
.ci-del:hover{color:#FFB4A6;background:rgba(196,87,78,.28)}
.chat-item:hover .ci-del{opacity:1}
.sb-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 14px;text-align:center;color:rgba(203,226,242,.55);font-size:12.5px}
.sb-empty img{width:74px;opacity:.9;animation:syFloat 5.2s ease-in-out infinite}

.sb-foot{display:flex;flex-direction:column;gap:8px;border-top:1px solid rgba(202,222,240,.13);padding-top:10px}
.sb-set{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:13.5px;
  color:rgba(228,240,250,.9);transition:all var(--tt) var(--tr)}
.sb-set:hover{background:rgba(202,222,240,.1);color:#fff}
.sb-set svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb-vs{display:flex;align-items:center;gap:9px;padding:2px 8px 2px}
.sb-vs img{height:22px;width:auto;padding:2px 7px;border-radius:7px;background:rgba(255,252,248,.94);box-shadow:0 1px 4px rgba(0,0,0,.22)}
.sb-vs span{font-size:10.5px;font-weight:600;letter-spacing:.1em;color:rgba(203,226,242,.5)}

/* collapsed rail */
.app.rail .sb{width:var(--sb-rail);padding:18px 10px 12px}
.app.rail .sb .txt,.app.rail .sb-name,.app.rail .sb-search,.app.rail .sb-cap,.app.rail .ci-txt,
.app.rail .ci-demo,.app.rail .sb-vs span,.app.rail .sb-list{display:none}
.app.rail .sb-brand{justify-content:center;border:0;padding-bottom:2px}
.app.rail .sb-coll{margin-left:0}
.app.rail .newchat{justify-content:center;padding:11px 0}
.app.rail .sb-foot{align-items:center}
.app.rail .sb-set{justify-content:center;padding:10px 0}
.app.rail .sb-vs{justify-content:center;padding:0}
.app.rail .sb-foot .rail-search{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:rgba(202,222,240,.09);color:rgba(203,226,242,.8)}
.app.rail .sb-foot .rail-search:hover{background:rgba(202,222,240,.16);color:#fff}
.sb-foot .rail-search{display:none}
</style>
